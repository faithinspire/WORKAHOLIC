[build]
command = "cd client && npm run build"
publish = "client/build"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[context.production]
command = "cd client && npm run build"

[context.deploy-preview]
command = "cd client && npm run build"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
