<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - WORKAHOLIC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #D85E2E;
            --secondary: #004E89;
            --accent: #F7931E;
            --dark: #1A1A1A;
            --light: #F8F9FA;
            --border: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .container {
            display: grid;
            grid-template-columns: 250px 300px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 10px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: #666;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 107, 53, 0.1);
            color: var(--primary);
        }

        .chat-list {
            background: white;
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            left: 250px;
            width: 300px;
            height: 100vh;
            overflow-y: auto;
        }

        .chat-list-header {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary);
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 10px;
            background: var(--light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .chat-item:hover,
        .chat-item.active {
            background: rgba(255, 107, 53, 0.1);
            border-left-color: var(--primary);
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--dark);
        }

        .chat-preview {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main {
            margin-left: 550px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 20px;
        }

        .messages-area {
            background: white;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.own {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.own .message-content {
            background: var(--primary);
            color: white;
        }

        .message.other .message-content {
            background: var(--light);
            color: var(--dark);
        }

        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .input-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-area input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 250px 1fr;
            }

            .chat-list {
                display: none;
            }

            .main {
                margin-left: 250px;
            }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                left: -250px;
                z-index: 100;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }

            .chat-list {
                display: none;
            }

            .main {
                margin-left: 0;
                padding: 15px;
            }

            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">🎓 WORKAHOLIC</div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="/jobseeker-dashboard-feed.html" class="sidebar-link">
                        <i class="fas fa-home"></i> Home Feed
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/jobseeker-dashboard.html" class="sidebar-link">
                        <i class="fas fa-briefcase"></i> Job Matches
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/portfolio.html" class="sidebar-link">
                        <i class="fas fa-user-circle"></i> My Portfolio
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/applications.html" class="sidebar-link">
                        <i class="fas fa-paper-plane"></i> Applications
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/saved-jobs.html" class="sidebar-link">
                        <i class="fas fa-bookmark"></i> Saved Jobs
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/messages.html" class="sidebar-link active">
                        <i class="fas fa-envelope"></i> Messages
                    </a>
                </li>
                <li class="sidebar-item" style="border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px;">
                    <a href="#" onclick="logout()" class="sidebar-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- CHAT LIST -->
        <div class="chat-list" id="chatList">
            <div class="chat-list-header">💬 Conversations</div>
            <div id="conversations"></div>
        </div>

        <!-- MAIN CHAT AREA -->
        <div class="main">
            <div class="chat-header">
                <h2 id="chatName">Select a conversation</h2>
            </div>

            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <p>Select a conversation to start messaging</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentConversation = null;
        let conversations = {};

        function loadConversations() {
            conversations = JSON.parse(localStorage.getItem('conversations') || '{}');
            displayConversations();
        }

        function displayConversations() {
            const keys = Object.keys(conversations);
            if (keys.length === 0) {
                document.getElementById('conversations').innerHTML = '<p style="color: #999; font-size: 12px; padding: 20px 0; text-align: center;">No conversations yet</p>';
                return;
            }

            const html = keys.map(key => `
                <div class="chat-item" onclick="selectConversation('${key}')">
                    <div class="chat-name">${key}</div>
                    <div class="chat-preview">${conversations[key].messages[conversations[key].messages.length - 1]?.text.substring(0, 30) || 'No messages'}</div>
                </div>
            `).join('');

            document.getElementById('conversations').innerHTML = html;
        }

        function selectConversation(name) {
            currentConversation = name;
            document.getElementById('chatName').textContent = name;
            displayMessages(conversations[name].messages);

            // Mark as active
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.chat-item')?.classList.add('active');
        }

        function displayMessages(messages) {
            const html = messages.map(msg => `
                <div class="message ${msg.own ? 'own' : 'other'}">
                    <div>
                        <div class="message-content">${msg.text}</div>
                        <div class="message-time">${new Date(msg.time).toLocaleTimeString()}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('messagesArea').innerHTML = html;
            document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !currentConversation) {
                alert('Select a conversation first');
                return;
            }

            if (!conversations[currentConversation]) {
                conversations[currentConversation] = { messages: [] };
            }

            conversations[currentConversation].messages.push({
                text,
                own: true,
                time: new Date()
            });

            localStorage.setItem('conversations', JSON.stringify(conversations));
            input.value = '';
            displayMessages(conversations[currentConversation].messages);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/index.html';
            }
        }

        window.addEventListener('load', loadConversations);
    </script>
</body>
</html>
