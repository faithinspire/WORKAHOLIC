<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - WORKAHOLIC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #D85E2E;
            --secondary: #004E89;
            --accent: #F7931E;
            --dark: #1A1A1A;
            --light: #F8F9FA;
            --border: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 10px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: #666;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 107, 53, 0.1);
            color: var(--primary);
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--dark);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .application-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .application-item {
            background: var(--light);
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .application-info {
            flex: 1;
        }

        .application-job {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .application-company {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .application-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-accepted {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .application-date {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .application-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                left: -250px;
                z-index: 100;
                box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            }

            .main {
                margin-left: 0;
            }

            .application-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .application-actions {
                width: 100%;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">🎓 WORKAHOLIC</div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="/jobseeker-dashboard-feed.html" class="sidebar-link">
                        <i class="fas fa-home"></i> Home Feed
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/jobseeker-dashboard.html" class="sidebar-link">
                        <i class="fas fa-briefcase"></i> Job Matches
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/portfolio.html" class="sidebar-link">
                        <i class="fas fa-user-circle"></i> My Portfolio
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/applications.html" class="sidebar-link active">
                        <i class="fas fa-paper-plane"></i> Applications
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/saved-jobs.html" class="sidebar-link">
                        <i class="fas fa-bookmark"></i> Saved Jobs
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/messages.html" class="sidebar-link">
                        <i class="fas fa-envelope"></i> Messages
                    </a>
                </li>
                <li class="sidebar-item" style="border-top: 1px solid var(--border); margin-top: 20px; padding-top: 20px;">
                    <a href="#" onclick="logout()" class="sidebar-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main">
            <div class="header">
                <h1>📋 My Applications</h1>
                <p>Track your job applications</p>
            </div>

            <div class="card">
                <h2>Application History</h2>
                <div class="application-list" id="applicationsList">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No applications yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function displayApplications(apps) {
            if (!apps || apps.length === 0) {
                document.getElementById('applicationsList').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>You haven\'t applied to any jobs yet</p></div>';
                return;
            }

            const html = apps.map(app => `
                <div class="application-item">
                    <div class="application-info">
                        <div class="application-job">${app.jobTitle || 'Job Title'}</div>
                        <div class="application-company">${app.company || 'Company'}</div>
                        <div>
                            <span class="application-status status-${app.status || 'pending'}">${(app.status || 'Pending').toUpperCase()}</span>
                        </div>
                        <div class="application-date">Applied on ${new Date(app.appliedAt || Date.now()).toLocaleDateString()}</div>
                    </div>
                    <div class="application-actions">
                        <button class="btn btn-secondary" onclick="viewJob('${app.jobId}')">View Job</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('applicationsList').innerHTML = html;
        }

        function viewJob(jobId) {
            alert('Viewing job details...');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/index.html';
            }
        }

        window.addEventListener('load', () => {
            // Load from localStorage
            const apps = JSON.parse(localStorage.getItem('userApplications') || '[]');
            displayApplications(apps);
        });
    </script>
</body>
</html>
