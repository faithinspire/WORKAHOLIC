<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKAHOLIC - Teaching & Jobs Platform Nigeria</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #D85E2E;
            --secondary: #004E89;
            --accent: #F7931E;
            --dark: #1A1A1A;
            --light: #F8F9FA;
            --border: #E0E0E0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #FAFAFA;
        }

        /* NAVBAR */
        nav {
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            gap: 20px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
            flex: 1;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        /* CONTAINER */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        /* HERO SECTION WITH PROFESSIONAL IMAGES */
        .hero-with-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 60px;
        }

        .hero-text h1 {
            font-size: 48px;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .hero-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .professional-image {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        .professional-image.large {
            grid-row: 1 / 3;
            height: 420px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .hero-buttons button {
            padding: 15px 40px;
            font-size: 16px;
        }

        /* NEWS SECTION */
        .news-section {
            margin-bottom: 60px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 30px;
        }

        .section-title i {
            color: var(--primary);
        }

        #newsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .news-image {
            height: 180px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        .news-content {
            padding: 20px;
        }

        .news-category {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .news-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .news-source {
            font-size: 12px;
            color: #999;
            font-weight: 600;
        }

        .news-date {
            font-size: 12px;
            color: #999;
        }

        .news-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: color 0.3s;
        }

        .news-link:hover {
            color: var(--primary-dark);
        }

        /* SIGNUP SECTION */
        .signup-section {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 60px;
        }

        .signup-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-full {
            grid-column: 1 / -1;
        }

        .form-buttons {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
        }

        .form-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        /* LOGIN SECTION */
        .login-section {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 0 auto;
        }

        /* WHATSAPP CHATBOX */
        .whatsapp-chatbox {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            cursor: pointer;
        }

        .whatsapp-bubble {
            width: 65px;
            height: 65px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .whatsapp-bubble:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-tooltip {
            position: absolute;
            bottom: 80px;
            right: 0;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 14px;
            white-space: nowrap;
            display: none;
            color: #333;
            font-weight: 500;
        }

        .whatsapp-chatbox:hover .whatsapp-tooltip {
            display: block;
        }

        /* BOTTOM NAVBAR FOR MOBILE */
        .bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            display: none;
            z-index: 98;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }

        .bottom-navbar-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
            max-width: 100%;
        }

        .bottom-navbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #999;
            text-decoration: none;
            flex: 1;
            text-align: center;
            font-size: 24px;
            transition: color 0.3s;
        }

        .bottom-navbar-item:hover,
        .bottom-navbar-item.active {
            color: var(--primary);
        }

        .bottom-navbar-item-label {
            font-size: 10px;
            color: inherit;
        }

        /* LOADING STATE */
        .loading-skeleton {
            background: white;
            border-radius: 12px;
            padding: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .message {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero-text h1 {
                font-size: 36px;
            }

            .navbar-container {
                padding: 12px 15px;
            }

            .nav-links {
                display: none;
            }

            .signup-form {
                grid-template-columns: 1fr;
            }

            #newsContainer {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px 15px;
                padding-bottom: 90px;
            }

            .hero-with-images {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .professional-image.large {
                grid-row: auto;
                height: 200px;
            }

            .hero-images {
                order: -1;
            }

            /* Show bottom navbar on mobile */
            .bottom-navbar {
                display: block;
            }

            body {
                padding-bottom: 70px;
            }

            .whatsapp-chatbox {
                bottom: 90px;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav>
        <div class="navbar-container">
            <div class="logo-section">
                <div class="logo-icon">🎓</div>
                <span>WORKAHOLIC</span>
            </div>
            <div class="nav-links">
                <a onclick="showSection('home')">Home</a>
                <a onclick="showSection('news')">News</a>
                <a onclick="showSection('signup')">Sign Up</a>
                <a onclick="showSection('login')">Login</a>
            </div>
            <div class="nav-buttons">
                <button class="btn-secondary" onclick="showSection('login')">Login</button>
                <button class="btn-primary" onclick="showSection('signup')">Get Started</button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <!-- HERO SECTION WITH PROFESSIONAL IMAGES -->
        <div id="heroSection" class="hero-with-images">
            <div class="hero-text">
                <h1>Welcome to WORKAHOLIC</h1>
                <p>Nigeria's leading platform for finding teaching, lecturing, and professional jobs</p>
                <div class="hero-buttons">
                    <button class="btn-secondary" onclick="showSection('signup')">Find Jobs</button>
                    <button class="btn-primary" onclick="window.location.href='/recruiter-signup.html'">Post a Job</button>
                </div>
            </div>
            <div class="hero-images">
                <div class="professional-image large" style="justify-content: center;">
                    <i class="fas fa-briefcase"></i>
                </div>
                <div class="professional-image">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="professional-image">
                    <i class="fas fa-graduation-cap"></i>
                </div>
            </div>
        </div>

        <!-- NEWS SECTION -->
        <div class="news-section">
            <div class="section-title">
                <i class="fas fa-newspaper"></i>
                Latest News & Updates
            </div>
            <div id="newsContainer">
                <div class="loading-skeleton" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: var(--primary);"></i>
                    <p style="color: #999; margin-top: 15px;">Loading news...</p>
                </div>
            </div>
        </div>

        <!-- SIGNUP SECTION -->
        <div id="signupSection" style="display: none;">
            <div class="signup-section">
                <h2 style="margin-bottom: 20px; color: var(--dark);">Create Your Account</h2>
                <div id="signupMessage" class="message"></div>
                <form id="signupForm" class="signup-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Account Type</label>
                        <select id="signupRole" required>
                            <option value="">Select Account Type</option>
                            <option value="job_seeker">Job Seeker</option>
                            <option value="recruiter">Recruiter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Job Category (for Job Seekers)</label>
                        <select id="signupCategory">
                            <option value="teaching">Teaching</option>
                            <option value="tech">Tech / IT</option>
                            <option value="freelance">Freelance</option>
                            <option value="corporate">Corporate</option>
                            <option value="healthcare">Healthcare</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="signupPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Create Account</button>
                        <button type="button" class="btn-secondary" onclick="showSection('home')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- LOGIN SECTION -->
        <div id="loginSection" style="display: none;">
            <div class="login-section">
                <h2 style="margin-bottom: 20px; color: var(--dark); text-align: center;">Login to Your Account</h2>
                <div id="loginMessage" class="message"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Login</button>
                        <button type="button" class="btn-secondary" onclick="showSection('home')">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- WHATSAPP CHATBOX -->
    <div class="whatsapp-chatbox" onclick="openWhatsApp()">
        <div class="whatsapp-bubble">
            <i class="fab fa-whatsapp"></i>
        </div>
        <div class="whatsapp-tooltip">Chat with Admin</div>
    </div>

    <!-- BOTTOM NAVBAR FOR MOBILE -->
    <div class="bottom-navbar">
        <div class="bottom-navbar-items">
            <a class="bottom-navbar-item active" onclick="showSection('home')">
                <i class="fas fa-home"></i>
                <span class="bottom-navbar-item-label">Home</span>
            </a>
            <a class="bottom-navbar-item" onclick="showSection('news')">
                <i class="fas fa-newspaper"></i>
                <span class="bottom-navbar-item-label">News</span>
            </a>
            <a class="bottom-navbar-item" onclick="showSection('signup')">
                <i class="fas fa-user-plus"></i>
                <span class="bottom-navbar-item-label">Sign Up</span>
            </a>
            <a class="bottom-navbar-item" onclick="showSection('login')">
                <i class="fas fa-sign-in-alt"></i>
                <span class="bottom-navbar-item-label">Login</span>
            </a>
        </div>
    </div>

    <script>
        // API BASE URL
        const API_BASE = '/api';
        
        // Admin WhatsApp Contact
        const ADMIN_PHONE = '08133050594';

        function openWhatsApp() {
            const message = encodeURIComponent('Hi, I would like to know more about FAITHJOBS platform.');
            window.open(`https://wa.me/${ADMIN_PHONE}?text=${message}`, '_blank');
        }

        // Show/hide sections
        function showSection(section) {
            document.getElementById('heroSection').style.display = section === 'home' ? 'grid' : 'none';
            document.getElementById('signupSection').style.display = section === 'signup' ? 'block' : 'none';
            document.getElementById('loginSection').style.display = section === 'login' ? 'block' : 'none';
            
            if (section === 'news') {
                loadNewsUpdates();
            }

            // Update bottom navbar active state
            document.querySelectorAll('.bottom-navbar-item').forEach(item => {
                item.classList.remove('active');
            });
            if (section === 'home') {
                document.querySelectorAll('.bottom-navbar-item')[0].classList.add('active');
            } else if (section === 'news') {
                document.querySelectorAll('.bottom-navbar-item')[1].classList.add('active');
            } else if (section === 'signup') {
                document.querySelectorAll('.bottom-navbar-item')[2].classList.add('active');
            } else if (section === 'login') {
                document.querySelectorAll('.bottom-navbar-item')[3].classList.add('active');
            }
        }

        // Load news from API
        function loadNewsUpdates() {
            console.log('📰 Loading news updates...');
            fetch(`${API_BASE}/news/all`)
                .then(res => {
                    console.log('Response status:', res.status);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    console.log('News data received:', data);
                    if (data.news && data.news.length > 0) {
                        const newsHTML = data.news.slice(0, 6).map(article => `
                            <div class="news-card">
                                <div class="news-image">
                                    <i class="fas fa-newspaper"></i>
                                </div>
                                <div class="news-content">
                                    <div class="news-category">${article.category.toUpperCase()}</div>
                                    <div class="news-title">${article.title}</div>
                                    <div class="news-description">${article.description}</div>
                                    <div class="news-meta">
                                        <span class="news-source">${article.source}</span>
                                        <span class="news-date">${new Date(article.published_at).toLocaleDateString()}</span>
                                    </div>
                                    ${article.external_url ? `<a href="${article.external_url}" target="_blank" class="news-link">Read More →</a>` : ''}
                                </div>
                            </div>
                        `).join('');
                        document.getElementById('newsContainer').innerHTML = newsHTML;
                    } else {
                        document.getElementById('newsContainer').innerHTML = '<p style="color: #999; text-align: center; grid-column: 1 / -1;">No news available at the moment.</p>';
                    }
                })
                .catch(err => {
                    console.error('Error loading news:', err);
                    document.getElementById('newsContainer').innerHTML = '<p style="color: red; text-align: center; grid-column: 1 / -1;">Failed to load news. Please try again later.</p>';
                });
        }

        // Handle signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('signupMessage');
            
            try {
                const role = document.getElementById('signupRole').value;
                const endpoint = role === 'job_seeker' ? '/auth/signup' : '/auth/recruiter/signup';
                
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value,
                        fullname: document.getElementById('signupName').value,
                        email: document.getElementById('signupEmail').value,
                        phone: document.getElementById('signupPhone').value,
                        password: document.getElementById('signupPassword').value,
                        category: document.getElementById('signupCategory').value,
                        role: document.getElementById('signupRole').value
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ Account created! You can now login.';
                    document.getElementById('signupForm').reset();
                    setTimeout(() => showSection('login'), 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.message || 'Signup failed');
                }
            } catch (err) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error: ' + err.message;
            }
        });

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('loginMessage');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.token) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ Login successful! Redirecting...';
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = '/dash-start.html';
                    }, 1500);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.message || 'Login failed');
                }
            } catch (err) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error: ' + err.message;
            }
        });

        // Load news on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, loading news...');
            loadNewsUpdates();
        });

        // Auto-refresh news every 30 minutes (1800000 milliseconds)
        setInterval(loadNewsUpdates, 30 * 60 * 1000);
    </script>
</body>
</html>
